<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-tx="html_dashboard.dashboard">Dashboard</title>

  <script>document.documentElement.classList.add("preload");</script>
  <style>
    html.preload, html.preload body { background:#f6f6f9; margin:0; }
    html.preload body { visibility: hidden; }
    html.preload #clubLoadingOverlay { visibility: visible; }
  </style>
  <script src="/js/ui/loader.preload.js?v=20260226-1"></script>

  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Estilos -->
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/pickups.css" />
  <link rel="stylesheet" href="/css/club-ui.css" />
</head>

<body class="loading">

  <!-- HEADER -->
  <div id="app-header"></div>

  <!-- CONTENIDO -->
  <main class="container py-4 dashboard-page">

    <!-- ================= KPIs ================= -->
    <section class="mb-4">
      <div class="row g-3">

        <div class="col-12 col-md-4">
          <div class="kpi-box h-100">
            <div class="kpi-value" id="kpiActivePlayers">—</div>
            <div class="kpi-label" data-tx="html_dashboard.jugadoresActivos">Jugadores activos</div>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="kpi-box h-100">
            <div class="kpi-value" id="kpiAvgAttendance">—</div>
            <div class="kpi-label" data-tx="html_dashboard.asistenciaPromedio">Asistencia promedio</div>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="kpi-box h-100">
            <div class="kpi-value" id="kpiTrainingsCount">—</div>
            <div class="kpi-label" data-tx="html_dashboard.entrenamientosRealizados">Entrenamientos realizados</div>
          </div>
        </div>

      </div>
    </section>

    <!-- ================= BLOQUE CENTRAL ================= -->
    <section class="mb-4">
      <div class="row g-4">

        <!-- CUMPLEAÑOS DEL MES -->
        <div class="col-12 col-lg-8">
          <div class="birthdays-card h-100">
            <h3 class="mb-3" data-tx="html_dashboard.cumpleanerosDelMes">🎂 Cumpleañeros del mes</h3>
            <div id="birthdaysList" data-tx="html_dashboard.cargando">
              Cargando…
            </div>
          </div>
        </div>

        <!-- PRÓXIMO TORNEO -->
        <div class="col-12 col-lg-4">
          <a id="nextTournamentCard" class="next-tournament-card h-100 text-center d-block text-decoration-none" href="#">
            <h3 class="mb-3" data-tx="html_dashboard.proximoTorneo">🏆 Próximo torneo</h3>
            <p class="t-date mb-1" id="nextTournamentDate" data-tx="html_dashboard.cargando">Cargando…</p>
            <p class="t-name mb-0" id="nextTournamentName">—</p>
          </a>
        </div>

      </div>
    </section>

    <!-- ================= CALENDARIO ================= -->
    <section class="mb-4">
      <div class="calendar-card">
        <h3 class="mb-1" id="eventsCalendarTitle">📅 Próximos eventos</h3>
        <div class="small text-muted mb-3" id="eventsCalendarHint"></div>
        <div id="eventsCalendar"><div class="text-muted small" data-tx="html_dashboard.cargando">Cargando…</div></div>
      </div>
    </section>

    <!-- ================= GALERÍA (subir fotos) ================= -->
    <section class="mb-4 d-none" id="galleryCardSection">
      <div class="calendar-card d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
          <h3 class="mb-1" id="galleryCardTitle">📸 Galería del club</h3>
          <div class="small text-muted" id="galleryCardHint"></div>
        </div>
        <button type="button" class="btn btn-primary" id="galleryCardBtn"></button>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="text-center text-muted pb-3">
    <small id="appVersion">v—</small>
  </footer>



  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/dashboard.js"></script>
  <script src="/js/layout.js" defer></script>

</body>
</html>
