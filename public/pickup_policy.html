<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelación y reembolsos</title>

  <script>document.documentElement.classList.add("preload");</script>
  <style>
    html.preload, html.preload body { background: #0b0b0c; }
    html.preload body { visibility: hidden; }
    html.preload #clubLoadingOverlay { visibility: visible; }
  </style>
  <script src="/js/ui/loader.preload.js"></script>

  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/pickups.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="container py-4" style="max-width: 760px;">
    <div class="mb-3">
      <h1 class="page-title mb-1" data-t="policy.pageTitle">Cancelación y reembolsos</h1>
      <div class="text-muted" data-t="policy.subtitle"></div>
    </div>

    <div class="card shadow-sm mb-3" id="cancellation">
      <div class="card-body">
        <h2 class="h5 mb-3" data-t="policy.cancellationTitle">Política de cancelación</h2>
        <div class="pk-rich" id="ppCancellation"></div>
      </div>
    </div>

    <div class="card shadow-sm mb-3" id="refunds">
      <div class="card-body">
        <h2 class="h5 mb-3" data-t="policy.refundsTitle">Reembolsos y crédito</h2>
        <div class="pk-rich" id="ppRefunds"></div>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-outline-secondary" id="ppBack" href="/public/pickups.html" data-t="policy.back">Volver</a>
      <a class="btn btn-success d-none" id="ppContact" href="#" target="_blank" rel="noopener" data-t="links.contact">Contacto</a>
    </div>
  </main>

  <script type="module" src="/js/public/pickup_policy.js"></script>
</body>
</html>
