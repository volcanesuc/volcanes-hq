<div class="modal fade" id="pickupEditorModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-fullscreen-md-down modal-xl">
    <div class="modal-content app-modal">
      <form id="pickupEditorForm" class="h-100 d-flex flex-column" novalidate>
        <div class="modal-header app-modal__header">
          <div>
            <h5 class="modal-title mb-0" id="peHeading" data-t="editor.new">Nuevo pickup</h5>
            <small class="app-modal__subtitle" data-t="editor.subtitle"></small>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body app-modal__body">
          <div class="row g-3">
            <div class="col-12 col-md-8">
              <label class="form-label" for="peTitle" data-t="editor.title">Título</label>
              <input id="peTitle" class="form-control" maxlength="120" required />
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label" for="peStatus" data-t="editor.status">Estado</label>
              <select id="peStatus" class="form-select"></select>
            </div>

            <div class="col-12">
              <label class="form-label" for="peSlug" data-t="editor.slug">Link</label>
              <div class="input-group">
                <span class="input-group-text small">/public/pickup.html?slug=</span>
                <input id="peSlug" class="form-control" maxlength="80" />
              </div>
              <div class="form-text" data-t="editor.slugHint"></div>
            </div>

            <!-- Un solo día: fecha + hora de inicio y de cierre (si cierra después de medianoche, termina al día siguiente) -->
            <div class="col-12 col-md-4">
              <label class="form-label" for="peDate" data-t="editor.date">Fecha</label>
              <input id="peDate" type="date" class="form-control" required />
              <div class="form-text" id="peTzHint"></div>
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label" for="peStartTime" data-t="editor.startTime">Hora de inicio</label>
              <input id="peStartTime" type="time" step="900" class="form-control" required />
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label" for="peEndTime" data-t="editor.endTime">Hora de cierre</label>
              <input id="peEndTime" type="time" step="900" class="form-control" />
              <div class="form-text" id="peEndHint"></div>
            </div>

            <div class="col-12 col-md-4">
              <label class="form-label" for="peVenue" data-t="editor.venue">Cancha</label>
              <select id="peVenue" class="form-select"></select>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label" for="peVenueName" data-t="editor.venueName">Lugar</label>
              <input id="peVenueName" class="form-control" maxlength="120" />
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label" for="peVenueAddress" data-t="editor.venueAddress">Dirección</label>
              <input id="peVenueAddress" class="form-control" maxlength="200" />
            </div>
            <div class="col-12">
              <label class="form-label" for="peMapsUrl" data-t="editor.maps">Mapa</label>
              <input id="peMapsUrl" class="form-control" placeholder="https://..." />
            </div>

            <div class="col-6 col-md-3">
              <label class="form-label" for="peCapacity" data-t="editor.capacity">Cupo</label>
              <input id="peCapacity" type="number" min="0" class="form-control" />
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label" for="peCancelHours" data-t="editor.deadlineHours">Hora límite</label>
              <input id="peCancelHours" type="number" min="0" step="0.5" class="form-control" />
            </div>
            <div class="col-12 col-md-6 d-flex flex-wrap gap-3 align-items-end">
              <div class="form-check form-switch">
                <input id="peAllowWaitlist" class="form-check-input" type="checkbox" />
                <label for="peAllowWaitlist" class="form-check-label" data-t="editor.waitlist">Lista de espera</label>
              </div>
              <div class="form-check form-switch">
                <input id="peNoShowMustPay" class="form-check-input" type="checkbox" />
                <label for="peNoShowMustPay" class="form-check-label" data-t="editor.noShowMustPay">No asiste, paga</label>
              </div>
              <div class="form-check form-switch">
                <input id="peIsPublic" class="form-check-input" type="checkbox" />
                <label for="peIsPublic" class="form-check-label" data-t="editor.isPublic">Público</label>
              </div>
            </div>

            <div class="col-12">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label mb-0" data-t="editor.tiers">Tarifas</label>
                <button type="button" class="btn btn-sm btn-outline-primary" id="peAddTier" data-t="settings.addTier">+</button>
              </div>
              <div id="peTiers" class="d-grid gap-2"></div>
            </div>

            <div class="col-12">
              <label class="form-label" for="peNotes" data-t="editor.notes">Notas</label>
              <textarea id="peNotes" class="form-control" rows="4"></textarea>
            </div>
          </div>
          <div class="small text-danger mt-3 d-none" id="peError"></div>
        </div>

        <div class="modal-footer app-modal__footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-t="common.cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary" data-t="editor.save">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
