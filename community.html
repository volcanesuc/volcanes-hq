<!DOCTYPE html>
<html lang="es" class="preload">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-tx="html_community.comunidad">Comunidad</title>

  <script>document.documentElement.classList.add("preload");</script>
  <style>
    html.preload,
    html.preload body {
      background: #f6f6f9;
      margin: 0;
    }

    html.preload body {
      visibility: hidden;
    }

    html.preload #clubLoadingOverlay {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
      display: flex !important;
    }
  </style>
  <script src="/js/ui/loader.preload.js?v=20260310-2"></script>

  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <!-- Global styles -->
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />

  <!-- Page styles -->
  <link rel="stylesheet" href="/css/community.css" />
  <link rel="stylesheet" href="/css/club-ui.css" />
</head>
<body class="loading">

  <!-- HEADER -->
  <div id="app-header"></div>

  <main class="container py-4 community-page">
    <div class="feed-wrap">

      <!-- Publicar -->
      <section class="feed-composer">
        <div class="feed-composer__row">
          <span id="composerAvatar"></span>
          <button id="newPostBtn" type="button" class="feed-composer__input" data-tx="html_community.queQuieresCompartir">¿Qué querés compartir?</button>
        </div>
        <div class="feed-composer__actions">
          <button type="button" data-compose="video"><i class="bi bi-youtube"></i><span data-tx="html_community.video">Video</span></button>
          <button type="button" data-compose="photo"><i class="bi bi-image"></i><span data-tx="html_community.foto">Foto</span></button>
          <button type="button" data-compose="document"><i class="bi bi-file-earmark-text"></i><span data-tx="html_community.documento">Documento</span></button>
          <button type="button" data-compose="announcement"><i class="bi bi-megaphone"></i><span data-tx="html_community.anuncio">Anuncio</span></button>
        </div>
      </section>

      <!-- Filtros -->
      <section class="feed-filters">
        <div class="feed-search">
          <i class="bi bi-search"></i>
          <input id="communitySearch" type="search" class="form-control" placeholder="Buscar por texto, autor o #tag" data-tx-placeholder="html_community.buscarPorTextoAutor" />
        </div>
        <div class="ui-chips" id="communityTypeChips">
          <button type="button" class="ui-chip is-active" data-type="" data-tx="html_community.todo">Todo</button>
          <button type="button" class="ui-chip" data-type="announcement" data-tx="html_community.anuncios">Anuncios</button>
          <button type="button" class="ui-chip" data-type="opinion" data-tx="html_community.opiniones">Opiniones</button>
          <button type="button" class="ui-chip" data-type="video" data-tx="html_community.videos">Videos</button>
          <button type="button" class="ui-chip" data-type="session" data-tx="html_community.sesiones">Sesiones</button>
          <button type="button" class="ui-chip" data-type="media" data-tx="html_community.fotosYMedia">Fotos y media</button>
          <button type="button" class="ui-chip" data-type="document" data-tx="html_community.documentos">Documentos</button>
        </div>
      </section>

      <div id="communityEmptyState" class="ui-empty" hidden>
        <div class="fs-2 mb-1"><i class="bi bi-chat-square-text"></i></div>
        <div class="fw-bold" data-tx="html_community.todaviaNoHayPosts">Todavía no hay posts</div>
        <div class="small" data-tx="html_community.publicaUnaOpinionUna">
          Publicá una opinión, una grabación de sesión, un documento o un recurso para el equipo.
        </div>
      </div>

      <div id="communityFeed" class="feed-list"></div>
    </div>
  </main>

  <div id="communityModalMount"></div>

  <!-- Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- JS -->
  <script type="module" src="/js/community.js"></script>
</body>
</html>
