<!DOCTYPE html>
<html lang="es" class="preload">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-tx="html_community.comunidad">Comunidad</title>

  <script>document.documentElement.classList.add("preload");</script>
  <style>
    html.preload,
    html.preload body {
      background: #0b0b0c;
      margin: 0;
    }

    html.preload body {
      visibility: hidden;
    }

    html.preload #clubLoadingOverlay {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
      display: flex !important;
    }
  </style>
  <script src="/js/ui/loader.preload.js?v=20260310-2"></script>

  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <!-- Global styles -->
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />

  <!-- Page styles -->
  <link rel="stylesheet" href="/css/community.css" />
  <link rel="stylesheet" href="/css/club-ui.css" />
</head>
<body class="loading">

  <!-- HEADER -->
  <div id="app-header"></div>

  <main class="container py-4 community-page">
    <section class="community-page-head mb-3">
      <div>
        <h1 class="page-title mb-1" data-tx="html_community.comunidad">Comunidad</h1>
        <div class="text-muted" data-tx="html_community.opinionesSesionesGrabadasRecursos">
          Opiniones, sesiones grabadas, recursos y contenido del club.
        </div>
      </div>

      <div class="community-actions">
        <button id="newPostBtn" type="button" class="btn btn-primary community-add-btn">
          <i class="bi bi-plus-lg"></i>
          <span class="label-desktop" data-tx="html_community.nuevoPost">Nuevo post</span>
          <span class="label-mobile" data-tx="html_community.crear">Crear</span>
        </button>
      </div>
    </section>

    <!-- KPIs -->
    <section class="row g-3 mb-3">
      <div class="col-12 col-md-4">
        <div class="card kpi-card">
          <div class="card-body">
            <div class="kpi-value" id="kpiPosts">0</div>
            <div class="kpi-label" data-tx="html_community.postsPublicados">Posts publicados</div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="card kpi-card">
          <div class="card-body">
            <div class="kpi-value" id="kpiVideos">0</div>
            <div class="kpi-label" data-tx="html_community.videosSesiones">Videos / sesiones</div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="card kpi-card">
          <div class="card-body">
            <div class="kpi-value" id="kpiResources">0</div>
            <div class="kpi-label" data-tx="html_community.recursosYMedia">Recursos y media</div>
          </div>
        </div>
      </div>
    </section>

    <!-- filtros -->
    <section class="card community-filters-panel mb-4">
      <button
        class="community-filters-toggle"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#communityFiltersCollapse"
        aria-expanded="true"
        aria-controls="communityFiltersCollapse"
      >
        <span class="fw-semibold">
          <i class="bi bi-funnel me-2"></i><span data-tx="html_community.filtros">Filtros</span>
        </span>
        <i class="bi bi-chevron-down community-filters-chevron"></i>
      </button>

      <div id="communityFiltersCollapse" class="collapse show">
        <div class="card-body community-filters-body">
          <div class="row g-3 align-items-end">
            <div class="col-12 col-md-4">
              <label class="form-label" data-tx="html_community.buscar">Buscar</label>
              <input
                id="communitySearch"
                type="search"
                class="form-control"
                placeholder="Buscar por título, texto, autor o tags" data-tx-placeholder="html_community.buscarPorTituloTexto"
              />
            </div>

            <div class="col-12 col-md-3">
              <label class="form-label" data-tx="html_community.tipo">Tipo</label>
              <select id="communityTypeFilter" class="form-select">
                <option value="" data-tx="html_community.todos">Todos</option>
                <option value="opinion" data-tx="html_community.opinion">Opinión</option>
                <option value="video" data-tx="html_community.video">Video</option>
                <option value="session" data-tx="html_community.sesion">Sesión</option>
                <option value="media" data-tx="html_community.media">Media</option>
                <option value="document" data-tx="html_community.documento">Documento</option>
                <option value="announcement" data-tx="html_community.anuncio">Anuncio</option>
              </select>
            </div>

            <div class="col-12 col-md-3">
              <label class="form-label" data-tx="html_community.destacados">Destacados</label>
              <select id="communityPinnedFilter" class="form-select">
                <option value="" data-tx="html_community.todos">Todos</option>
                <option value="pinned" data-tx="html_community.soloDestacados">Solo destacados</option>
                <option value="not-pinned" data-tx="html_community.noDestacados">No destacados</option>
              </select>
            </div>

            <div class="col-12 col-md-2 d-grid">
              <button
                id="clearCommunityFiltersBtn"
                type="button"
                class="btn btn-outline-danger"
              >
                <i class="bi bi-x-circle"></i>
                <span data-tx="html_community.limpiar">Limpiar</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- destacados -->
    <section class="mb-4" id="featuredSection" hidden>
      <div class="d-flex align-items-center gap-2 mb-2">
        <h2 class="section-title mb-0" data-tx="html_community.destacados">Destacados</h2>
        <span class="badge text-bg-warning" data-tx="html_community.pinned">Pinned</span>
      </div>
      <div id="featuredPosts" class="community-feed"></div>
    </section>

    <!-- feed -->
    <section>
      <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
        <h2 class="section-title mb-0" data-tx="html_community.feed">Feed</h2>
        <small class="text-muted" id="communityCountLabel" data-tx="html_community.t0Posts">0 posts</small>
      </div>

      <div id="communityEmptyState" class="community-empty" hidden>
        <div class="community-empty__icon">
          <i class="bi bi-chat-square-text"></i>
        </div>
        <h3 class="community-empty__title" data-tx="html_community.todaviaNoHayPosts">Todavía no hay posts</h3>
        <p class="community-empty__text mb-0" data-tx="html_community.publicaUnaOpinionUna">
          Publicá una opinión, una grabación de sesión, un documento o un recurso para el equipo.
        </p>
      </div>

      <div id="communityFeed" class="community-feed"></div>
    </section>
  </main>

  <div id="communityModalMount"></div>

  <!-- Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- JS -->
  <script type="module" src="/js/community.js"></script>
</body>
</html>
