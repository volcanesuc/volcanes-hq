<div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content player-modal">

      <form id="playerForm" class="h-100 d-flex flex-column">
        <input type="hidden" id="playerId" />

        <div class="modal-header player-modal__header">
          <div>
            <h5 class="modal-title mb-0 text-white" id="playerModalTitle" data-tx="html_player_modal.jugador">Jugador</h5>
            <small class="player-modal__subtitle text-white" id="playerModalSubtitle" data-tx="html_player_modal.nuevoEditar">
              Nuevo / Editar
            </small>
          </div>

          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
            aria-label="Cerrar" data-tx-aria-label="html_player_modal.cerrar"
          ></button>
        </div>

        <div class="modal-body player-modal__body flex-grow-1">
          <div class="row g-3">

            <div class="col-12 col-md-6">
              <label class="form-label" for="firstName" data-tx="html_player_modal.nombre">Nombre</label>
              <input type="text" id="firstName" class="form-control" required />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label" for="lastName" data-tx="html_player_modal.apellido">Apellido</label>
              <input type="text" id="lastName" class="form-control" required />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label" for="idNumber" data-tx="html_player_modal.documentoDeIdentidad">Documento de identidad</label>
              <input type="text" id="idNumber" class="form-control" placeholder="Ej: 1-2345-6789" data-tx-placeholder="html_player_modal.ej123456789" />
            </div>

            <div class="col-12 col-md-4">
              <label class="form-label" for="gender" data-tx="html_player_modal.genero">Género</label>
              <select id="gender" class="form-select">
                <option value="">—</option>
                <option value="M" data-tx="html_player_modal.masculino">Masculino</option>
                <option value="F" data-tx="html_player_modal.femenino">Femenino</option>
                <option value="X" data-tx="html_player_modal.otro">Otro</option>
              </select>
            </div>

            <div class="col-12 col-md-4">
              <label class="form-label" for="birthday" data-tx="html_player_modal.nacimiento">Nacimiento</label>
              <input type="date" id="birthday" class="form-control" />
            </div>

            <div class="col-12 col-md-4">
              <label class="form-label" for="number" data-tx="html_player_modal.numeroDeCamisa">Número de camisa</label>
              <input type="number" id="number" class="form-control" />
            </div>

            <div class="col-12">
              <label class="form-label" for="role" data-tx="html_player_modal.rol">Rol</label>
              <select
                id="role"
                class="form-select"
                data-role-select="player"
              >
                <option value="" data-tx="html_player_modal.cargandoRoles">Cargando roles…</option>
              </select>
            </div>

            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="active" checked />
                <label class="form-check-label" for="active" data-tx="html_player_modal.jugadorActivo">Jugador activo</label>
              </div>
            </div>

          </div>
        </div>

        <div class="modal-footer player-modal__footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-tx="html_player_modal.cancelar">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary" id="playerSaveBtn" data-tx="html_player_modal.guardar">
            Guardar
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
