<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ejercicios</title>

  <script>document.documentElement.classList.add("preload");</script>
  <style>
    html.preload, html.preload body { background: #f6f6f9; }
    html.preload body { visibility: hidden; }
    html.preload #clubLoadingOverlay { visibility: visible; }
  </style>
  <script src="/js/ui/loader.preload.js"></script>

  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/gym.css" />
  <link rel="stylesheet" href="/css/club-ui.css" />
</head>

<body class="loading">
  <div id="app-header"></div>

  <main class="container py-4 ui-page">
    <a class="gx-back" href="/gimnasio.html"><i class="bi bi-arrow-left"></i> <span id="exBack">Gimnasio</span></a>

    <div class="gx-head">
      <div>
        <h1 class="page-title mb-1" id="exTitle">Ejercicios</h1>
        <div class="text-muted" id="exSubtitle"></div>
      </div>
      <div class="gx-head__actions">
        <button type="button" class="btn btn-outline-primary d-none" id="exImportBtn"><i class="bi bi-cloud-download me-1"></i><span></span></button>
        <button type="button" class="btn btn-primary d-none" id="exNewBtn"><i class="bi bi-plus-lg me-1"></i><span></span></button>
      </div>
    </div>

    <div class="alert d-none" id="exAlert" role="alert"></div>

    <div class="ui-filterbar mb-2">
      <div class="ui-search">
        <i class="bi bi-search"></i>
        <input type="search" class="form-control" id="exSearch" />
      </div>
      <select class="form-select" id="exEquipment"></select>
    </div>

    <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap mb-3">
      <div class="ui-chips gx-muscle-chips" id="exMuscles"></div>
      <div class="small text-muted" id="exCount"></div>
    </div>

    <div id="exGrid" class="gx-grid"></div>
  </main>

  <div id="modalMount"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/gym_ejercicios.js"></script>
</body>
</html>
