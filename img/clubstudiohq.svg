<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ClubStudioHQ">
  <title>ClubStudioHQ</title>
  <!-- versión simple del logo (pestaña del navegador y barra superior): sin la etiqueta HQ -->
  <defs>
    <linearGradient id="cshq-fav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#cshq-fav)"/>
  <ellipse cx="32" cy="33" rx="27" ry="10" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3" transform="rotate(-16 32 33)"/>
  <circle cx="55.5" cy="24.5" r="3.8" fill="#fff"/>
  <text x="31" y="44" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="32" letter-spacing="-2" fill="#fff">CS</text>
</svg>
