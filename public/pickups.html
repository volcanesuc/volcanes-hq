<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickups</title>

  <script>document.documentElement.classList.add("preload");</script>
  <style>
    html.preload, html.preload body { background: #f6f6f9; }
    html.preload body { visibility: hidden; }
    html.preload #clubLoadingOverlay { visibility: visible; }
  </style>
  <script src="/js/ui/loader.preload.js"></script>

  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/pickups.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="container py-4" style="max-width: 1040px;">
    <!-- qué es -->
    <section class="card shadow-sm mb-4 pk-hero">
      <div class="card-body p-4">
        <h1 class="page-title mb-3" data-t="calendar.aboutTitle">¿Qué es un pickup?</h1>
        <div class="pk-rich lead-sm" id="pcAbout"></div>
        <div class="d-flex flex-wrap gap-2 mt-3">
          <a class="btn btn-primary" href="#sessions" data-t="calendar.upcomingTitle">Próximos pickups</a>
          <a class="btn btn-outline-secondary" href="/public/pickup_policy.html" data-t="links.policy">Cancelación y reembolsos</a>
          <a class="btn btn-outline-success d-none" id="pcContact" href="#" target="_blank" rel="noopener" data-t="links.contact">Contacto</a>
        </div>
      </div>
    </section>

    <!-- cómo funciona -->
    <section class="mb-4" id="pcHowWrap">
      <h2 class="h5 mb-3" data-t="calendar.howTitle">Cómo funciona</h2>
      <div class="row g-3" id="pcHow"></div>
    </section>

    <!-- próximos -->
    <section class="card shadow-sm mb-4" id="sessions">
      <div class="card-body">
        <h2 class="h5 mb-1" data-t="calendar.upcomingTitle">Próximos pickups</h2>
        <div class="small text-muted mb-3" data-t="calendar.upcomingHint"></div>

        <div id="pcCalendar"></div>
      </div>
    </section>

    <!-- preguntas -->
    <section class="mb-4" id="pcFaqWrap">
      <h2 class="h5 mb-3" data-t="calendar.faqTitle">Preguntas frecuentes</h2>
      <div class="d-grid gap-2" id="pcFaq"></div>
    </section>
  </main>

  <script type="module" src="/js/public/pickups_calendar.js"></script>
</body>
</html>
