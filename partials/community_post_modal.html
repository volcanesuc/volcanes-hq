<div class="modal fade" id="communityPostModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content app-modal">

      <form id="communityPostForm" class="h-100 d-flex flex-column">
        <input type="hidden" id="communityPostId" />

        <div class="modal-header app-modal__header">
          <div>
            <h5 class="modal-title mb-0" id="communityModalTitle" data-tx="html_community_post_modal.nuevoPost">Nuevo post</h5>
            <small class="app-modal__subtitle" id="communityModalSubtitle" data-tx="html_community_post_modal.compartiIdeasSesionesGrabadas">
              Compartí ideas, sesiones grabadas y recursos del club
            </small>
          </div>
          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
            aria-label="Cerrar" data-tx-aria-label="html_community_post_modal.cerrar"
          ></button>
        </div>

        <div class="modal-body app-modal__body">
          <div class="card app-form-card">
            <div class="card-body">
              <div class="row g-3">

                <div class="col-12 col-md-8">
                  <label class="form-label" for="postTitle" data-tx="html_community_post_modal.titulo">Título</label>
                  <input id="postTitle" class="form-control" maxlength="120" required />
                </div>

                <div class="col-12 col-md-4">
                  <label class="form-label" for="postType" data-tx="html_community_post_modal.tipo">Tipo</label>
                  <select id="postType" class="form-select" required>
                    <option value="opinion" data-tx="html_community_post_modal.opinion">Opinión</option>
                    <option value="video" data-tx="html_community_post_modal.video">Video</option>
                    <option value="session" data-tx="html_community_post_modal.sesion">Sesión</option>
                    <option value="media" data-tx="html_community_post_modal.media">Media</option>
                    <option value="document" data-tx="html_community_post_modal.documento">Documento</option>
                    <option value="announcement" data-tx="html_community_post_modal.anuncio">Anuncio</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label" for="postSummary" data-tx="html_community_post_modal.resumenCorto">Resumen corto</label>
                  <input
                    id="postSummary"
                    class="form-control"
                    maxlength="180"
                    placeholder="Una línea corta para preview del card" data-tx-placeholder="html_community_post_modal.unaLineaCortaPara"
                  />
                </div>

                <div class="col-12">
                  <label class="form-label" for="postBody" data-tx="html_community_post_modal.contenido">Contenido</label>
                  <textarea
                    id="postBody"
                    class="form-control"
                    rows="6"
                    placeholder="Escribí la opinión, resumen o descripción del recurso"
                  ></textarea data-tx-placeholder="html_community_post_modal.escribiLaOpinionResumen">
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="postExternalUrl" data-tx="html_community_post_modal.linkExterno">Link externo</label>
                  <input
                    id="postExternalUrl"
                    type="url"
                    class="form-control"
                    placeholder="https://..."
                  />
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="postYouTubeUrl" data-tx="html_community_post_modal.linkDeYoutube">Link de YouTube</label>
                  <input
                    id="postYouTubeUrl"
                    type="url"
                    class="form-control"
                    placeholder="https://www.youtube.com/watch?v=..."
                  />
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="postMediaType" data-tx="html_community_post_modal.tipoDeMedia">Tipo de media</label>
                  <select id="postMediaType" class="form-select">
                    <option value="" data-tx="html_community_post_modal.ninguno">Ninguno</option>
                    <option value="image" data-tx="html_community_post_modal.imagen">Imagen</option>
                    <option value="pdf" data-tx="html_community_post_modal.pdf">PDF</option>
                    <option value="link" data-tx="html_community_post_modal.link">Link</option>
                    <option value="other" data-tx="html_community_post_modal.otro">Otro</option>
                  </select>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="postMediaUrl" data-tx="html_community_post_modal.urlDelMedia">URL del media</label>
                  <input
                    id="postMediaUrl"
                    type="url"
                    class="form-control"
                    placeholder="https://..."
                  />
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="postTags" data-tx="html_community_post_modal.tags">Tags</label>
                  <input
                    id="postTags"
                    class="form-control"
                    placeholder="estrategia, torneo, offense, defensa" data-tx-placeholder="html_community_post_modal.estrategiaTorneoOffenseDefensa"
                  />
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="postVisibility" data-tx="html_community_post_modal.visibilidad">Visibilidad</label>
                  <select id="postVisibility" class="form-select">
                    <option value="club" data-tx="html_community_post_modal.club">Club</option>
                    <option value="staff" data-tx="html_community_post_modal.soloStaff">Solo staff</option>
                  </select>
                </div>

                <div class="col-12">
                  <div class="form-check form-switch">
                    <input id="postPinned" class="form-check-input" type="checkbox" />
                    <label for="postPinned" class="form-check-label" data-tx="html_community_post_modal.marcarComoDestacado">
                      Marcar como destacado
                    </label>
                  </div>
                </div>

                <div class="col-12">
                  <div class="community-form-help">
                    <i class="bi bi-info-circle"></i>
                    <span data-tx="html_community_post_modal.siPegasUnLink">Si pegás un link de YouTube válido, el video se mostrará embebido en el card.</span>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer app-modal__footer">
          <div class="app-modal__footer-right d-flex gap-2 ms-auto">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-tx="html_community_post_modal.cancelar">
              Cancelar
            </button>
            <button id="savePostBtn" type="submit" class="btn btn-primary">
              <i class="bi bi-save"></i>
              <span data-tx="html_community_post_modal.guardarPost">Guardar post</span>
            </button>
          </div>
        </div>
      </form>

    </div>
  </div>
</div>
