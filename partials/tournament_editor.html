<div class="modal fade" id="tournamentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content app-modal">

      <form id="tournamentForm" class="h-100 d-flex flex-column">
        <input type="hidden" id="tournamentId" />

        <!-- HEADER -->
        <div class="modal-header app-modal__header">
          <div>
            <h5 class="modal-title mb-0" id="tournamentModalTitle">—</h5>
            <small class="app-modal__subtitle" id="tournamentModalSubtitle">—</small>
          </div>
          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
            aria-label="Cerrar" data-tx-aria-label="html_tournament_editor.cerrar"
          ></button>
        </div>

        <!-- BODY -->
        <div class="modal-body app-modal__body">
          <div class="card app-form-card">
            <div class="card-body">
              <div class="row g-3">

                <div class="col-md-6">
                  <label id="lblName" class="form-label"></label>
                  <input id="tournamentName" class="form-control" required />
                </div>

                <div class="col-md-3">
                  <label id="lblDateStart" class="form-label"></label>
                  <input id="dateStart" type="date" class="form-control" required />
                </div>

                <div class="col-md-3">
                  <label id="lblDateEnd" class="form-label"></label>
                  <input id="dateEnd" type="date" class="form-control" />
                </div>

                <div class="col-md-4">
                  <label id="lblType" class="form-label"></label>
                  <select id="type" class="form-select"></select>
                </div>

                <div class="col-md-4">
                  <label id="lblAge" class="form-label"></label>
                  <select id="age" class="form-select"></select>
                </div>

                <div class="col-md-4">
                  <label id="lblVenue" class="form-label"></label>
                  <select id="venue" class="form-select"></select>
                </div>

                <div class="col-md-6">
                  <label id="lblLocation" class="form-label"></label>
                  <input id="location" class="form-control" />
                </div>

                <div class="col-md-6">
                  <label class="form-label" for="officialUrl" data-tx="html_tournament_editor.sitioOficialDelTorneo">Sitio oficial del torneo</label>
                  <input
                    id="officialUrl"
                    type="url"
                    class="form-control"
                    placeholder="https://ejemplo.com"
                  />
                  <div class="form-text" data-tx="html_tournament_editor.linkAlTorneoEn">
                    Link al torneo en Ultiworld, WFDF, Instagram o web oficial
                  </div>
                </div>

                <div class="col-md-3">
                  <label id="lblFeeCurrency" class="form-label" data-tx="html_tournament_editor.moneda">Moneda</label>
                  <select id="feeCurrency" class="form-select">
                    <option value="CRC" data-tx="html_tournament_editor.colones">Colones (₡)</option>
                    <option value="USD" data-tx="html_tournament_editor.dolares">Dólares ($)</option>
                  </select>
                </div>

                <div class="col-md-3">
                  <label id="lblTeamFee" class="form-label"></label>
                  <input id="teamFee" type="number" step="0.01" min="0" class="form-control" />
                </div>

                <div class="col-md-3">
                  <label id="lblPlayerFee" class="form-label"></label>
                  <input id="playerFee" type="number" step="0.01" min="0" class="form-control" />
                </div>

                <div class="col-12">
                  <label id="lblNotes" class="form-label"></label>
                  <textarea id="notes" class="form-control" rows="3"></textarea>
                </div>

                <div class="col-12">
                  <div class="form-check form-switch mt-2">
                    <input id="confirmed" type="checkbox" class="form-check-input" />
                    <label id="lblConfirmed" class="form-check-label" for="confirmed"></label>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>

        <!-- FOOTER -->
        <div class="modal-footer app-modal__footer">
          <div class="app-modal__footer-left">
            <button
              type="button"
              id="deleteTournamentBtn"
              class="btn btn-outline-danger" data-tx="html_tournament_editor.eliminar"
            >
              Eliminar
            </button>
          </div>

          <div class="app-modal__footer-right d-flex gap-2">
            <button
              type="button"
              id="btnCancel"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal" data-tx="html_tournament_editor.cancelar"
            >
              Cancelar
            </button>
            <button
              type="submit"
              id="btnSave"
              class="btn btn-primary" data-tx="html_tournament_editor.guardar"
            >
              Guardar
            </button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
