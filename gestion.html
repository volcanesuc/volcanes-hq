<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-tx="html_gestion.gestion">Gestión</title>

  <script>document.documentElement.classList.add("preload");</script>
  <style>
    html.preload, html.preload body { background: #f6f6f9; }
    html.preload body { visibility: hidden; }
    html.preload #clubLoadingOverlay { visibility: visible; }
  </style>
  <script src="/js/ui/loader.preload.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos -->
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/association.css" />
  <link rel="stylesheet" href="/css/club-ui.css" />
</head>

<body class="loading association-page">

  <!-- HEADER GLOBAL -->
  <div id="app-header"></div>

  <main class="container py-4 ui-page">

    <!-- Encabezado de la sección (Personas / Dinero) -->
    <section class="ui-hero mb-3">
      <div>
        <div class="ui-hero__eyebrow" data-tx="html_gestion.gestion">Gestión</div>
        <h1 class="ui-hero__title" id="hubTitle">—</h1>
        <p class="ui-hero__sub mb-0" id="hubSubtitle"></p>
      </div>
    </section>

    <!-- Vistas de la sección -->
    <nav class="ui-chips mb-3" id="hubViews" aria-label="Vistas"></nav>

    <section id="hubContent" data-hub></section>

  </main>

  <!-- Modal Host (reusable) -->
  <div id="modalHost" class="mh-backdrop d-none" aria-hidden="true">
    <div class="mh-shell" role="dialog" aria-modal="true">
      <iframe id="modalFrame" class="mh-frame" src="about:blank"></iframe>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="/js/gestion.js"></script>
</body>
</html>
